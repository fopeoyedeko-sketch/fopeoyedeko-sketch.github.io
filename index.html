<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Pages</title>
<style>
  :root { --bg:#fbfaf7; --fg:#26241f; --muted:#6d6a62; --line:#e4e1d8; --accent:#2f6f5e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#191816; --fg:#ece9e2; --muted:#a19d94; --line:#34322d; --accent:#7cc4ad; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif; }
  main { max-width:640px; margin:0 auto; padding:56px 16px; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-weight:400; font-size:2rem; margin:0 0 4px; }
  p.lead { color:var(--muted); margin:0 0 32px; }
  a.card { display:block; padding:18px 20px; border:1px solid var(--line); border-radius:10px; text-decoration:none; color:inherit; margin-bottom:12px; }
  a.card:hover { border-color:var(--accent); }
  a.card b { display:block; font-weight:600; }
  a.card span { color:var(--muted); font-size:.92rem; }
</style>
</head>
<body>
<main>
  <h1>Pages</h1>
  <p class="lead">Private pages, opened by direct link.</p>
  <a class="card" href="energy/"><b>Energy usage</b><span>Electricity use and cost from the smart meter, updated every morning.</span></a>
</main>
</body>
</html>
