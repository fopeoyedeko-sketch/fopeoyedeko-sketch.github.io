<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Vouchers · Home panel</title>
<link rel="stylesheet" href="../assets/site.css">
<script src="../assets/d3.min.js"></script>
<script src="../assets/kit.js"></script>
<style>
  .list { display: grid; gap: 12px; margin-top: 16px; }
  .vc { display: grid; grid-template-columns: 1fr auto; gap: 6px 18px; align-items: start; background: var(--panel); border: 1px solid var(--rule); border-left: 5px solid var(--st); border-radius: 14px; padding: 16px 18px; box-shadow: var(--shadow); }
  .vc h3 { margin: 0; font: 650 1.15rem/1.2 var(--display); font-stretch: 90%; }
  .vc .amt { font: 650 1.7rem/1 var(--display); font-stretch: 80%; font-variant-numeric: tabular-nums; text-align: right; }
  .vc .meta { grid-column: 1 / -1; color: var(--graphite); font-size: .88rem; }
  .vc .note { grid-column: 1 / -1; font-size: .92rem; }
  .vc .when { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; font-size: .84rem; color: var(--graphite); }
  .bar2 { flex: 1; height: 6px; border-radius: 99px; background: var(--grid); overflow: hidden; }
  .bar2 i { display: block; height: 100%; background: var(--st); border-radius: 99px; }
  .pill { display: inline-block; font: 500 .76rem/1 var(--body); padding: 4px 9px; border-radius: 99px; background: color-mix(in srgb, var(--st) 16%, transparent); color: var(--st); margin-left: 8px; vertical-align: 3px; }
  .s-soon { --st: var(--bad); } .s-check { --st: var(--volt); } .s-ok { --st: var(--good); } .s-pending { --st: var(--graphite); }
</style>
</head>
<body>
<main class="page">
  <section class="head">
    <h1>Vouchers</h1>
    <p id="take">Loading…</p>
  </section>
  <section class="stats" aria-label="Summary">
    <div class="stat"><div class="k">To spend</div><div class="v" id="total">—</div><div class="s" id="totalS">&nbsp;</div></div>
    <div class="stat"><div class="k">Next to expire</div><div class="v" id="next">—</div><div class="s" id="nextS">&nbsp;</div></div>
    <div class="stat"><div class="k">Still to arrive</div><div class="v" id="pend">—</div><div class="s" id="pendS">&nbsp;</div></div>
  </section>
  <div class="panel-head"><h2>Your vouchers</h2><div id="filter"></div></div>
  <div class="list" id="list"></div>
  <p class="foot" id="foot"></p>
</main>
<script>
kit.nav('Vouchers', '../');
(async () => {
  const $ = id => document.getElementById(id), { fmt } = kit;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const days = s => Math.round((new Date(s + 'T00:00:00') - today) / 864e5);
  const dfmt = s => d3.timeFormat('%-d %b %Y')(new Date(s + 'T12:00:00'));
  let data;
  try { [data] = await kit.load(['vouchers.json']); }
  catch (e) { $('take').textContent = 'The voucher list could not be loaded. Try refreshing the page.'; $('take').className = 'err'; return; }
  const all = data.vouchers.filter(v => v.status !== 'used' && !(v.expires && days(v.expires) < 0));
  const have = all.filter(v => v.status !== 'pending'), pend = all.filter(v => v.status === 'pending');
  const dated = have.filter(v => v.expires).sort((a, b) => a.expires.localeCompare(b.expires));
  kit.countUp($('total'), d3.sum(have, v => v.value_gbp), fmt.gbp); $('totalS').textContent = have.length + ' vouchers and gift cards';
  kit.countUp($('pend'), d3.sum(pend, v => v.value_gbp), fmt.gbp); $('pendS').textContent = pend.length + ' rewards signed up for';
  if (dated.length) { const n = dated[0], d = days(n.expires); $('next').textContent = d <= 0 ? 'Today' : d + (d === 1 ? ' day' : ' days'); $('nextS').textContent = n.brand + ' ' + fmt.gbp0(n.value_gbp) + (n.expiry_confirmed ? '' : ' · date to check'); }
  const soon = dated.filter(v => days(v.expires) <= 30);
  $('take').textContent = (soon.length ? (soon.length === 1 ? 'One voucher' : soon.length + ' vouchers') + ' may run out in the next 30 days. ' : 'Nothing runs out in the next 30 days. ') + 'Codes stay in your email; this page tracks what you have and when to use it.';

  const state = v => v.status === 'pending' ? ['s-pending', 'Waiting to arrive'] : v.expires && days(v.expires) <= 30 ? ['s-soon', 'Use soon'] : (!v.expires || v.status === 'check') ? ['s-check', 'Check expiry'] : ['s-ok', 'Unused'];
  const render = f => {
    const list = $('list'); list.innerHTML = '';
    const items = f === 'pending' ? pend : f === 'have' ? [...dated, ...have.filter(v => !v.expires)] : [...dated, ...have.filter(v => !v.expires), ...pend];
    if (!items.length) { list.textContent = 'Nothing here right now.'; return; }
    items.forEach(v => {
      const [cls, label] = state(v), el = document.createElement('article'); el.className = 'vc ' + cls;
      const h = document.createElement('h3'); h.textContent = v.brand; h.append(Object.assign(document.createElement('span'), { className: 'pill', textContent: label }));
      const a = document.createElement('div'); a.className = 'amt'; a.textContent = fmt.gbp(v.value_gbp);
      const m = document.createElement('div'); m.className = 'meta'; m.textContent = v.type + ' · ' + (v.status === 'pending' ? 'signed up ' : 'received ') + dfmt(v.received) + ' · ' + v.where;
      const n = document.createElement('div'); n.className = 'note'; n.textContent = v.note || '';
      el.append(h, a, m, n);
      if (v.expires && v.status !== 'pending') {
        const total = Math.max(1, (new Date(v.expires) - new Date(v.received)) / 864e5), left = Math.max(0, days(v.expires));
        const w = document.createElement('div'); w.className = 'when';
        w.innerHTML = '<span></span><div class="bar2" role="presentation"><i></i></div><span></span>';
        w.children[0].textContent = 'Time left'; w.children[2].textContent = (v.expiry_confirmed ? 'Expires ' : 'Probably expires ') + dfmt(v.expires);
        w.querySelector('i').style.width = Math.min(100, left / total * 100) + '%';
        el.append(w);
      }
      list.append(el);
    });
  };
  kit.seg($('filter'), [['all', 'All'], ['have', 'In hand'], ['pending', 'Waiting']], 'all', render);
  render('all');
  $('foot').textContent = 'Updated ' + dfmt(data.updated) + ' from your email. Used or expired vouchers drop off automatically.';
})();
</script>
</body>
</html>
